services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U attendance -d attendance']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${API_PORT:-8080}:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://attendance:attendance@postgres:5432/attendance

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-only-development-secret-32-chars}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173,http://localhost:3000}

      S3_ENDPOINT: ${S3_ENDPOINT:-https://placeholder.r2.cloudflarestorage.com}
      S3_BUCKET: ${S3_BUCKET:-attendance-photos}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-placeholder-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-placeholder-secret}

      SEED_ON_START: ${SEED_ON_START:-true}

volumes:
  postgres-data:
